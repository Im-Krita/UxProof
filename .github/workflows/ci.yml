name: CI

on:
  push:
    branches: [core-roadmap, master, main]
  pull_request:

jobs:
  required:
    name: Runner, UI build, Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install app dependencies
        run: npm ci
      - name: Install runner dependencies
        run: npm ci
        working-directory: runner
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: runner
      - name: Runner unit and integration tests
        run: npm run test:runner
      - name: Typecheck and build UI
        run: npm run build
      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri

  integration:
    name: Demo relay checks
    runs-on: windows-latest
    needs: required
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install runner dependencies
        run: npm ci
        working-directory: runner
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: runner
      - name: Start demo relay
        run: Start-Process node -ArgumentList 'demo/server.mjs' -RedirectStandardOutput demo.log -RedirectStandardError demo.err
      - name: Wait for relay
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 40; $i++) {
            try { $r = Invoke-WebRequest -Uri http://127.0.0.1:4180/ -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200) { exit 0 } } catch { }
            Start-Sleep -Seconds 1
          }
          Write-Error 'Relay did not start'
      - name: Edge cases
        run: npm run test:edge
      - name: Fixed relay verification
        run: npm run test:fix
      - name: Smoke audit
        run: npm run smoke
      - name: Stop relay
        if: always()
        shell: pwsh
        run: Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.StartTime -gt (Get-Date).AddMinutes(-10) } | Stop-Process -Force -ErrorAction SilentlyContinue

  portable:
    name: Portable runtime (nightly)
    if: github.event_name == 'push' && github.ref == 'refs/heads/core-roadmap'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install runner dependencies
        run: npm ci
        working-directory: runner
      - name: Install Chromium shell
        run: npx playwright install --only-shell chromium
        working-directory: runner
      - name: Portable audit
        run: npm run test:portable
